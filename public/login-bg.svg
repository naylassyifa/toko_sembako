<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="#3b82f6" opacity="0.05"/>
  <circle cx="1820" cy="950" r="150" fill="#3b82f6" opacity="0.05"/>
  <circle cx="1700" cy="200" r="120" fill="#2563eb" opacity="0.03"/>
  <circle cx="300" cy="850" r="100" fill="#1d4ed8" opacity="0.04"/>
  
  <!-- Wavy patterns -->
  <path d="M 0 200 Q 480 150 960 200 T 1920 200" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.15"/>
  <path d="M 0 400 Q 480 350 960 400 T 1920 400" stroke="#2563eb" stroke-width="2" fill="none" opacity="0.1"/>
  <path d="M 0 600 Q 480 550 960 600 T 1920 600" stroke="#1d4ed8" stroke-width="2" fill="none" opacity="0.08"/>
  
  <!-- Shopping cart icons scattered -->
  <text x="150" y="300" font-size="60" opacity="0.05">🛒</text>
  <text x="1750" y="650" font-size="70" opacity="0.06">📦</text>
  <text x="400" y="950" font-size="55" opacity="0.05">💰</text>
  <text x="1600" y="100" font-size="65" opacity="0.04">🏪</text>
  
  <!-- Grid pattern subtle -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.03">
    <line x1="0" y1="0" x2="1920" y2="0"/>
    <line x1="0" y1="100" x2="1920" y2="100"/>
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="500" x2="1920" y2="500"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="700" x2="1920" y2="700"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="1000" x2="1920" y2="1000"/>
    <line x1="0" y1="1080" x2="1920" y2="1080"/>
  </g>
</svg>